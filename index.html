    <!-- Script defensivo de rede para Google Ads / Analytics / GTM -->
    <script>
      (function() {
        // Função utilitária para verificar se a rota bloqueia chamadas gtag/dataLayer genéricas.
        // As páginas próprias da Nuvvo (/login, /admin/login, /cadastro) possuem rastreamento ativo
        // do Google Ads da Nuvvo (AW-18513891486) e Meta Pixel da Nuvvo, portanto NÃO devem ser bloqueadas aqui.
        // O bloqueio é estrito apenas para painel logado (/admin pós-login, /master).
        function isCurrentRouteAdmin() {
          try {
            var p = (window.location.pathname || '').toLowerCase().trim();
            // Rotas abertas da Nuvvo onde tags da própria plataforma são permitidas
            if (p === '/login' || p === '/login/' || p === '/admin/login' || p === '/admin/login/' || p === '/cadastro' || p === '/cadastro/') {
              return false;
            }
            if (p.indexOf('/admin') === 0 || p.indexOf('/master') === 0) {
              return true;
            }
            return false;
          } catch (_) {
            return false;
          }
        }

        // Silencia unhandledrejection global para falhas de rede do Google Ads / Remarketing
        window.addEventListener("unhandledrejection", function (e) {
          try {
            var r = e.reason;
            var m = typeof r === "string" ? r : (r && r.message) || "";
            var s = (r && r.stack) || "";
            var isGoogleErr =
              m.indexOf("rmkt") !== -1 ||
              m.indexOf("AW-403144958") !== -1 ||
              m.indexOf("googleadservices") !== -1 ||
              m.indexOf("googletagmanager") !== -1 ||
              s.indexOf("rmkt") !== -1 ||
              s.indexOf("AW-403144958") !== -1 ||
              s.indexOf("googletagmanager") !== -1 ||
              s.indexOf("googleadservices") !== -1 ||
              (m.indexOf("HTTP 0") !== -1 && (s.indexOf("gtag") !== -1 || s.indexOf("collect") !== -1 || m.indexOf("collect") !== -1));
            if (isGoogleErr) {
              e.preventDefault();
              e.stopPropagation();
            }
          } catch (_) {}
        });

        // Silencia erros de script globais gerados por domínios do Google
        window.addEventListener(
          "error",
          function (e) {
            try {
              var fn = e.filename || "";
              var m = e.message || "";
              var s = (e.error && e.error.stack) || "";
              if (
                fn.indexOf("googletagmanager.com") !== -1 ||
                fn.indexOf("googleadservices.com") !== -1 ||
                fn.indexOf("google.com/rmkt") !== -1 ||
                fn.indexOf("rmkt") !== -1 ||
                m.indexOf("rmkt") !== -1 ||
                m.indexOf("AW-403144958") !== -1 ||
                s.indexOf("googletagmanager") !== -1 ||
                s.indexOf("AW-403144958") !== -1
              ) {
                e.preventDefault();
                e.stopPropagation();
                return true;
              }
            } catch (_) {}
          },
          true,
        );

        // dataLayer e gtag stub com gate de rota:
        // se a página atual for administrativa (/admin/* ou /master/*), bloqueia push de eventos e chamadas gtag
        window.dataLayer = window.dataLayer || [];
        var rawPush = window.dataLayer.push.bind(window.dataLayer);
        window.dataLayer.push = function() {
          if (isCurrentRouteAdmin()) {
            return window.dataLayer.length;
          }
          return rawPush.apply(window.dataLayer, arguments);
        };

        window.gtag = function() {
          if (isCurrentRouteAdmin()) {
            return;
          }
          window.dataLayer.push(arguments);
        };

      })();
    </script>
    <title>Nuvvo - Plataforma de Vendas e Locação</title>
    <meta
      name="description"
      content="Nuvvo - plataforma completa para empresas de venda e locação."
    />
    <meta name="author" content="Nuvvo" />

    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta

      content="Nuvvo - plataforma completa para empresas de venda e locação."
    />
    <meta name="twitter:image" content="/og-image.png" />
